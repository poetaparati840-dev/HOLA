<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol animado</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.mobile.css" media="only screen and (max-width: 600px)">

    <style>
      .tree-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        z-index: 2;
      }

      .animated-heart {
        transform-origin: center;
        animation: beat 1s infinite;
      }

      @keyframes beat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.1); }
        40% { transform: scale(0.95); }
        60% { transform: scale(1.08); }
        80% { transform: scale(1); }
      }

    .menu {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%); /* centra */
    display: flex; /* 🔥 los pone en fila */
    gap: 10px; /* espacio entre botones */
    z-index: 999;
}

      .menu button {
        display: block;
        margin-bottom: 10px;
        padding: 10px 15px;
        border: none;
        background: #2ecc71;
        color: white;
        cursor: pointer;
        border-radius: 5px;
      }

      .menu button:hover {
        background: #27ae60;
      }
    </style>
</head>

<body>

    <!-- 🔥 BOTONES -->
    <div class="menu">
        <button onclick="irPagina('codigo2')">Ir a Código </button>
    </div>

    <div id="floating-objects"></div>

    <div class="dedication-text" id="dedication-text">
      <div class="signature" id="signature"></div>
    </div>

    <div class="countdown" id="countdown"></div>

    <div class="tree-container" id="tree-container"></div>

    <audio src="musica.mp3" id="bg-music" preload="auto"></audio>

    <script>
      function irPagina(pagina){
        window.location.href = pagina;
      }
    </script>

    <script src="scrip.js"></script>
<div class="imagen-carta">
    <img src="imagen1.jpg" alt="Imagen de amor">
</div>
</body>
</html>
